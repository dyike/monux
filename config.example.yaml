node:
  name: linux

peers:
  - name: mac
    url: http://192.168.5.82:8765
    # Set this when the Mac server uses --token/MONUX_HTTP_TOKEN.
    # token: replace-with-the-same-secret

monitor:
  # Platform-local identifier reported by: monux detect
  # Linux uses an I2C bus number; macOS and Windows use a display number.
  id: "15"

inputs:
  # Labels identify the computers connected to these monitor inputs.
  # Connector names are translated to DDC values internally.
  mac: hdmi-1
  linux: displayport-1
  windows: displayport-2
